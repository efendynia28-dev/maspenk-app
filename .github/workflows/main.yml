name: MP mini Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Android Gradle Plugin
        shell: bash
        run: |
          set -e

          echo "Checking Gradle project..."

          if [ -f "build.gradle" ]; then
            echo "Found root build.gradle"

            python3 - <<'PY'
          from pathlib import Path

          p = Path("build.gradle")
          text = p.read_text()

          old = "id 'com.android.application'"
          new = "id 'com.android.application' version '8.7.3'"

          if old in text and "com.android.application' version" not in text:
              text = text.replace(old, new, 1)
              p.write_text(text)
              print("Android Gradle Plugin version added: 8.7.3")
          else:
              print("No root AGP modification required.")
          PY
          fi

      - name: Build MP mini APK
        run: |
          set -e
          gradle --no-daemon assembleDebug

      - name: Check APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK tidak ditemukan!"
            echo "Isi folder build:"
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK berhasil dibuat:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MP-mini-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
