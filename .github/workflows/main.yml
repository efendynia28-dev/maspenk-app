name: MASPENK V29 Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          mkdir build-src
          ZIP=$(find . -type f -name "*.zip" ! -name "MASPENK_V29_CLEAN_V3.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Android project ZIP tidak ditemukan"
            exit 1
          fi
          echo "Using: $ZIP"
          unzip -q "$ZIP" -d build-src

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          PROJECT=$(find build-src -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Project Android tidak ditemukan"
            exit 1
          fi
          cd "$(dirname "$PROJECT")"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maspenk-v29-apk
          path: build-src/**/build/outputs/apk/debug/*.apk          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
      - name: Build APK
        run: |
         cd "$PROJECT_DIR"
         gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maspenk-v27-apk
          path: |
            **/build/outputs/apk/debug/*.apk
